repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-toml
      - id: check-yaml
        args:
          - --unsafe
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args:
          # Preserve intentional two-space line breaks in markdown.
          - --markdown-linebreak-ext=md
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        name: ruff check (api)
        args:
          - --fix
        files: ^api/
      - id: ruff-format
        name: ruff format (api)
        files: ^api/
  - repo: local
    hooks:
      - id: pyright
        name: pyright (api)
        language: system
        files: ^api/
        entry: bash -c 'cd api && uv run pyright'
        pass_filenames: false
      - id: requirements
        name: export requirements (api)
        language: system
        files: ^api/uv\.lock$
        pass_filenames: false
        entry: bash -c 'cd api && uv export --no-dev --no-hashes -o requirements.txt'
      - id: requirements-test
        name: export requirements-test (api)
        language: system
        files: ^api/uv\.lock$
        pass_filenames: false
        entry: bash -c 'cd api && uv export --no-hashes -o requirements-test.txt'
      - id: oxfmt-platform
        name: oxfmt (platform)
        language: system
        files: ^platform/.*\.(js|jsx|ts|tsx|json|md|yaml|yml|css|scss|sass)$
        entry: bash -c 'cd platform && npx oxfmt --no-error-on-unmatched-pattern "${@#platform/}"' --
      - id: oxlint-platform
        name: oxlint (platform)
        language: system
        files: ^platform/.*\.(js|jsx|ts|tsx)$
        entry: bash -c 'cd platform && npx oxlint --fix --deny-warnings --no-error-on-unmatched-pattern "${@#platform/}"' --
      - id: type-check-platform
        name: type-check (platform)
        language: system
        files: ^platform/.*\.(ts|tsx)$
        pass_filenames: false
        entry: bash -c 'cd platform && npm run type-check'
      - id: oxfmt-site
        name: oxfmt (site)
        language: system
        files: ^site/.*\.(js|jsx|ts|tsx|json|md|yaml|yml|css|scss|sass)$
        entry: bash -c 'cd site && npx oxfmt --no-error-on-unmatched-pattern "${@#site/}"' --
      - id: oxlint-site
        name: oxlint (site)
        language: system
        files: ^site/.*\.(js|jsx|ts|tsx)$
        entry: bash -c 'cd site && npx oxlint --fix --deny-warnings --no-error-on-unmatched-pattern "${@#site/}"' --
      - id: type-check-site
        name: type-check (site)
        language: system
        files: ^site/.*\.(ts|tsx)$
        pass_filenames: false
        entry: bash -c 'cd site && npm run type-check'
      - id: oxfmt-admin
        name: oxfmt (admin)
        language: system
        files: ^admin/.*\.(js|jsx|ts|tsx|json|md|yaml|yml|css|scss|sass)$
        entry: bash -c 'cd admin && npx oxfmt --no-error-on-unmatched-pattern "${@#admin/}"' --
      - id: oxlint-admin
        name: oxlint (admin)
        language: system
        files: ^admin/.*\.(js|jsx|ts|tsx)$
        entry: bash -c 'cd admin && npx oxlint --fix --deny-warnings --no-error-on-unmatched-pattern "${@#admin/}"' --
      - id: type-check-admin
        name: type-check (admin)
        language: system
        files: ^admin/.*\.(ts|tsx)$
        pass_filenames: false
        entry: bash -c 'cd admin && npm run type-check'
